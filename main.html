<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap');

    :root {
      --bg: #0b0c0f;
      --text: #f4f1ea;
      --muted: #8d9098;
      --line: rgba(255,255,255,.1);
      --accent: #d8ff63;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 50% 45%,
          rgba(216, 255, 99, .07),
          transparent 30%
        ),
        var(--bg);

      color: var(--text);
      font-family: "DM Sans", sans-serif;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    /* subtle grain */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .035;

      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
    }

    .page {
      width: min(1100px, 90vw);
      min-height: 680px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px 0;
      position: relative;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;

      animation: fadeDown 1s ease forwards;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;

      font-size: 13px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .brand-mark {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);

      box-shadow:
        0 0 18px rgba(216,255,99,.7);
    }

    .status {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .04em;
    }

    .hero {
      position: relative;
      max-width: 850px;

      animation: reveal 1.2s cubic-bezier(.2,.7,.2,1) forwards;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;

      margin-bottom: 26px;

      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 38px;
      height: 1px;
      background: var(--accent);
    }

    h1 {
      font-family: "Playfair Display", serif;
      font-size: clamp(70px, 12vw, 155px);
      line-height: .82;
      font-weight: 500;
      letter-spacing: -.055em;
    }

    h1 span {
      display: block;
      color: transparent;

      -webkit-text-stroke: 1px rgba(244,241,234,.3);

      transform: translateX(8vw);
    }

    .description {
      max-width: 420px;
      margin-top: 48px;
      margin-left: 12%;

      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }

    .description strong {
      color: var(--text);
      font-weight: 500;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding-top: 20px;
      border-top: 1px solid var(--line);

      color: var(--muted);
      font-size: 12px;

      animation: fadeUp 1s ease .3s both;
    }

    .coordinates {
      font-variant-numeric: tabular-nums;
    }

    .scroll {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .scroll-line {
      width: 32px;
      height: 1px;
      background: var(--muted);
    }

    /* decorative circle */
    .orb {
      position: absolute;
      right: 4%;
      top: 22%;

      width: 180px;
      height: 180px;

      border: 1px solid rgba(255,255,255,.08);
      border-radius: 50%;

      animation: float 7s ease-in-out infinite;
    }

    .orb::before,
    .orb::after {
      content: "";
      position: absolute;
      inset: 18px;

      border: 1px solid rgba(255,255,255,.06);
      border-radius: 50%;
    }

    .orb::after {
      inset: 48px;
      border-color: rgba(216,255,99,.25);
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(40px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeDown {
      from {
        opacity: 0;
        transform: translateY(-15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-18px) rotate(8deg);
      }
    }

    @media (max-width: 700px) {
      .page {
        min-height: 620px;
        padding: 30px 0;
      }

      .status {
        display: none;
      }

      h1 {
        font-size: clamp(64px, 20vw, 110px);
      }

      h1 span {
        transform: translateX(0);
      }

      .description {
        margin-left: 0;
        margin-top: 38px;
      }

      .orb {
        width: 120px;
        height: 120px;
        right: -20px;
        top: 12%;
        opacity: .5;
      }

      .footer {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <header class="top">
      <div class="brand">
        <span class="brand-mark"></span>
        HELLO / 001
      </div>

      <div class="status">
        A small beginning
      </div>
    </header>

    <section class="hero">

      <div class="eyebrow">
        Welcome
      </div>

      <h1>
        Hello
        <span>World.</span>
      </h1>

      <p class="description">
        A tiny sentence with an unnecessarily sophisticated website.
        <strong>Because apparently even Hello World needs good typography.</strong>
      </p>

      <div class="orb"></div>

    </section>

    <footer class="footer">
      <span>Built with HTML & CSS</span>

      <span class="scroll">
        SCROLL
        <span class="scroll-line"></span>
      </span>

      <span class="coordinates">
        01 / 01
      </span>
    </footer>

  </main>

</body>
</html>
